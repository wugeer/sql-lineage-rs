name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "手动触发时是否创建或更新 GitHub Release（需配合 tag，或在当前提交创建对应版本的 release）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: hive-lineage

jobs:
  prepare:
    name: Resolve version & run tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve and validate version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --locked --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" != "v$VERSION" ]]; then
              echo "::error::Tag '$TAG' does not match Cargo.toml version '$VERSION' (expected 'v$VERSION')"
              exit 1
            fi
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit and integration tests
        run: cargo test --locked

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.target }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.14.1"

      - name: Install cargo-zigbuild, cargo-deb, cargo-generate-rpm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm

      - name: Build static musl binary
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package .tar.gz, .deb, .rpm
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          BIN_PATH="target/${{ matrix.target }}/release/${{ env.BIN_NAME }}"
          test -x "$BIN_PATH"
          file "$BIN_PATH"

          mkdir -p dist
          STAGE="${{ env.BIN_NAME }}-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "$STAGE"
          cp "$BIN_PATH" "$STAGE/"
          cp README.md LICENSE sql/postgres_ddl.sql "$STAGE/"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"

          cargo deb --no-build --no-strip --target "${{ matrix.target }}" \
            --output "dist/${{ env.BIN_NAME }}_${VERSION}_${{ matrix.deb_arch }}.deb"
          dpkg-deb -I "dist/${{ env.BIN_NAME }}_${VERSION}_${{ matrix.deb_arch }}.deb"
          dpkg-deb -c "dist/${{ env.BIN_NAME }}_${VERSION}_${{ matrix.deb_arch }}.deb"

          cargo generate-rpm --target "${{ matrix.target }}" --arch "${{ matrix.rpm_arch }}" \
            --output "dist/${{ env.BIN_NAME }}-${VERSION}-1.${{ matrix.rpm_arch }}.rpm"
          ls -lh dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: prepare
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.target }}

      - name: Build macOS release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package .tar.gz and .pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          BIN_PATH="target/${{ matrix.target }}/release/${{ env.BIN_NAME }}"
          test -x "$BIN_PATH"
          file "$BIN_PATH"

          mkdir -p dist
          STAGE="${{ env.BIN_NAME }}-${VERSION}-macos-${{ matrix.arch }}"
          mkdir -p "$STAGE"
          cp "$BIN_PATH" "$STAGE/"
          cp README.md LICENSE sql/postgres_ddl.sql "$STAGE/"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"

          PKG_ROOT="pkg-root"
          mkdir -p "${PKG_ROOT}/usr/local/bin" "${PKG_ROOT}/usr/local/share/doc/${{ env.BIN_NAME }}"
          install -m 755 "$BIN_PATH" "${PKG_ROOT}/usr/local/bin/${{ env.BIN_NAME }}"
          install -m 644 README.md LICENSE sql/postgres_ddl.sql "${PKG_ROOT}/usr/local/share/doc/${{ env.BIN_NAME }}/"

          pkgbuild \
            --root "$PKG_ROOT" \
            --identifier "io.github.hive-lineage.cli" \
            --version "$VERSION" \
            --install-location "/" \
            "dist/${{ env.BIN_NAME }}-${VERSION}-macos-${{ matrix.arch }}.pkg"
          ls -lh dist/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/*

  build-windows:
    name: Build Windows (x64)
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Install cargo-wix
        run: cargo install --locked cargo-wix --version "^0.3"

      - name: Build Windows release binary
        run: cargo build --release --locked

      - name: Package .zip and .msi
        run: |
          $ErrorActionPreference = "Stop"
          $Version = "${{ needs.prepare.outputs.version }}"
          $BinPath = "target\release\${{ env.BIN_NAME }}.exe"
          if (-not (Test-Path $BinPath)) {
            throw "Missing binary at $BinPath"
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $Stage = "${{ env.BIN_NAME }}-${Version}-windows-x64"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          Copy-Item $BinPath "$Stage\"
          Copy-Item "README.md", "LICENSE", "sql\postgres_ddl.sql" "$Stage\"
          Compress-Archive -Path $Stage -DestinationPath "dist\${Stage}.zip" -Force

          cargo wix --no-build --nocapture
          $Msi = Get-ChildItem -Path "target\wix" -Filter "*.msi" | Select-Object -First 1
          if (-not $Msi) {
            throw "No .msi produced in target\wix"
          }
          Copy-Item $Msi.FullName "dist\${{ env.BIN_NAME }}-${Version}-windows-x64.msi"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x64
          path: dist/*

  release:
    name: Publish Release & Checksums
    needs: [prepare, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Upload combined artifacts with checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-v${{ needs.prepare.outputs.version }}
          path: artifacts/*

      - name: Publish GitHub Release
        if: needs.prepare.outputs.is_tag == 'true' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          generate_release_notes: true
          files: artifacts/*
