[package]
name = "hive_sql_parse"
version = "0.1.0"
edition = "2021"

[dependencies]
mimalloc = "0.1.52"
smallvec = "1.16"
sqlparser = "=0.63.0"
rayon = "1.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.44"
anyhow = "1"
rustc-hash = "2.1.3"
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-postgres = "0.7.15"

[[bin]]
name = "hive-lineage"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
