[package]
name = "hive_sql_parse"
version = "0.1.0"
edition = "2021"
authors = ["wugeer"]
license = "MIT"
description = "Hive / Spark SQL lineage analyzer, PostgreSQL append-only store, and web visualizer"
readme = "README.md"

[package.metadata.deb]
name = "hive-lineage"
maintainer = "wugeer"
copyright = "2026, wugeer"
license-file = ["LICENSE", "4"]
depends = ""
section = "utility"
priority = "optional"
assets = [
    ["target/release/hive-lineage", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/hive-lineage/README.md", "644"],
    ["LICENSE", "usr/share/doc/hive-lineage/LICENSE", "644"],
    ["sql/postgres_ddl.sql", "usr/share/doc/hive-lineage/postgres_ddl.sql", "644"],
]

[package.metadata.generate-rpm]
name = "hive-lineage"
auto-req = "no"
assets = [
    { source = "target/release/hive-lineage", dest = "/usr/bin/hive-lineage", mode = "0755" },
    { source = "README.md", dest = "/usr/share/doc/hive-lineage/README.md", mode = "0644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/hive-lineage/LICENSE", mode = "0644", doc = true },
    { source = "sql/postgres_ddl.sql", dest = "/usr/share/doc/hive-lineage/postgres_ddl.sql", mode = "0644", doc = true },
]

[dependencies]
mimalloc = "0.1.52"
smallvec = "1.16"
sqlparser = "=0.63.0"
rayon = "1.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.44"
anyhow = "1"
rustc-hash = "2.1.3"
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-postgres = "0.7.15"

[[bin]]
name = "hive-lineage"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
